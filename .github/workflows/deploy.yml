name: Deploy

# Production deploy with a preview-gated pipeline. Today (2026-05-18) a
# straight push-deploy broke prod for ~15 min because GH Actions didn't
# have NEXT_PUBLIC_* vars set at build time and Next inlined them as
# undefined. Now: every build first goes to a preview URL, smoke-tests
# against that URL, and only if the smoke test passes does the SAME
# artifact get re-deployed to main. A broken bundle stays in preview
# and prod keeps serving the last known-good deploy.
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN — a cfut_ token with Pages:Edit + Workers:Edit
#   - CLOUDFLARE_ACCOUNT_ID — REDACTED_CLOUDFLARE_ACCOUNT_ID
#
# Required to be committed at repo root in `.env.production`:
#   - NEXT_PUBLIC_SUPABASE_URL — public, anon-key-only, safe to commit
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY — public-by-design (RLS gates writes)
# The build sanity check (preflight) blocks deploy if these aren't set.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via preview → prod
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Preflight — verify required secrets are set, then write .env.production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL is not set on the repository."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY is not set on the repository."
            exit 1
          fi
          # Write a runner-local .env.production. This file lives only on
          # the ephemeral GitHub Actions runner — never committed to the
          # repo. Next.js auto-loads it during the build so NEXT_PUBLIC_*
          # values get inlined into the client bundle. After the build
          # the runner is destroyed and the file is gone.
          cat > packages/app/.env.production <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
          EOF
          echo "Preflight OK — .env.production written for build."

      - name: Build tracker
        run: pnpm --filter @htmlradar/tracker build

      - name: Copy tracker into app's public/v1
        run: cp packages/tracker/dist/tracker.js packages/app/public/v1/tracker.js

      - name: Build app for Cloudflare Pages
        run: cd packages/app && pnpm exec next-on-pages

      - name: Bundle check — verify NEXT_PUBLIC_* were actually inlined
        run: |
          set -e
          BUNDLE_DIR="packages/app/.vercel/output/static/_worker.js"
          if ! grep -rq 'supabase.co' "$BUNDLE_DIR" 2>/dev/null; then
            echo "::error::Built bundle has no supabase.co URL — NEXT_PUBLIC_SUPABASE_URL was undefined at build time."
            exit 1
          fi
          echo "Bundle check OK — NEXT_PUBLIC_* values inlined."

      - name: Deploy to PREVIEW (not main)
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/app/.vercel/output/static
            --project-name=htmlradar
            --branch=ci-preview
            --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
            --commit-dirty=false

      - name: Extract preview URL
        id: preview-url
        run: |
          # wrangler-action exposes `deployment-url` for some calls but not
          # all — the most reliable read is the URL it prints. The action
          # uses CLOUDFLARE_DEPLOYMENT_URL as a step output when it exists.
          URL="${{ steps.preview.outputs.deployment-url }}"
          if [ -z "$URL" ]; then
            echo "::error::Could not extract preview deployment URL."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to: $URL"

      # Brief cold-start grace — CF Pages preview deploys race ahead of
      # full edge propagation; the very first request to a fresh URL
      # occasionally returns a stale/empty body for one path before
      # settling. 8 seconds is enough in practice and trivial in cost.
      - name: Preview warm-up wait
        run: sleep 8

      - name: Smoke test the preview deploy
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
        run: |
          set -e
          fail=0
          # Per-check retry: up to 3 attempts, 2s back-off. Eliminates
          # transient cold-start flakes (the kind that nuked the
          # ac1144e deploy with a false-negative on /robots.txt) without
          # masking real regressions — a genuinely broken bundle fails
          # all 3 attempts.
          check() {
            local path="$1"
            local expect="$2"
            local attempt
            local code
            for attempt in 1 2 3; do
              code=$(curl -sL -o /tmp/page -w "%{http_code}" "${PREVIEW_URL}${path}")
              if [ "$code" = "200" ] && { [ -z "$expect" ] || grep -q "$expect" /tmp/page; }; then
                echo "  ✓ ${path}"
                return
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 2
              fi
            done
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code} (expected 200) after 3 attempts"
            else
              echo "::error::${path} returned 200 but body missing expected '${expect}' after 3 attempts"
            fi
            fail=$((fail + 1))
          }

          echo "Smoke testing preview: $PREVIEW_URL"
          check "/" "HTMLRadar"
          check "/pricing" "pricing"
          check "/sign-in" "sign-in"
          check "/docs" ""    # 200 with redirect or content is fine
          check "/feedback" "Tell us what we missed"
          check "/v1/tracker.js" "qualifiedMs"   # confirms Release B tracker shipped
          check "/sitemap.xml" "htmlradar.com"   # confirms SEO fix shipped
          check "/robots.txt" "Sitemap"

          if [ $fail -gt 0 ]; then
            echo "::error::$fail smoke check(s) failed — NOT promoting to prod."
            exit 1
          fi
          echo "All smoke checks passed."

      - name: Promote preview → prod (deploy to main branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/app/.vercel/output/static
            --project-name=htmlradar
            --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
            --commit-dirty=false

      # Cloudflare Pages deploys the Next.js app. The /r/* recipient
      # path is served by a separate Worker (packages/proxy) — without
      # this step, proxy changes (download guard, materials panel,
      # tracker injection) sit unpublished even after CI is green.
      # The 2026-05-18 incident where Feature 1's download guard was
      # 'shipped' to git but not live until manually `wrangler deploy`d
      # is the bug this step prevents.
      #
      # `continue-on-error: true` — `wrangler deploy` does two operations:
      #   1. Upload + activate the new worker version (Account scope:
      #      Workers Scripts: Edit). This is the deploy that matters.
      #   2. Sync the [[routes]] block from wrangler.toml (Zone scope:
      #      Workers Routes: Edit). Routes are already configured at the
      #      zone level — this is a no-op confirmation call.
      #
      # The CLOUDFLARE_API_TOKEN we use has scope (1) but NOT scope (2)
      # — adding zone-level Routes:Edit requires recreating the token in
      # the dashboard. Step (1) succeeds (verified: new worker versions
      # appear in `wrangler deployments list` and serve on prod routes
      # correctly), so the deploy IS happening. Step (2) errors with
      # Authentication 10000, which we treat as non-blocking. If the
      # token is later widened to include zone Routes:Edit, this flag
      # can be removed.
      - name: Deploy proxy worker (packages/proxy)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/proxy
          command: deploy

      # Monitor cron worker (packages/monitor) — same pattern as the
      # proxy step. Same continue-on-error rationale: wrangler may
      # error on a follow-up routes/triggers API call our token can't
      # touch; the worker upload itself uses the Account-scope token
      # which works. Without this step the cron monitor sits at
      # whatever version was last manually deployed.
      - name: Deploy monitor worker (packages/monitor)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/monitor
          command: deploy

      # Independent verification that the proxy IS serving a recent
      # version, regardless of the above step's exit code. If this
      # check fails it means the worker upload itself broke (a real
      # regression), so this step does NOT continue-on-error.
      - name: Verify proxy is serving (independent of wrangler exit code)
        run: |
          set -e
          code=$(curl -sL -o /tmp/r-resp -w "%{http_code}" "https://htmlradar.com/r/nonexistent-smoke-test")
          if [ "$code" != "404" ]; then
            echo "::error::/r/<missing> returned HTTP $code (expected 404 from the proxy)"
            exit 1
          fi
          if ! grep -q "no-store\|Not Found" /tmp/r-resp; then
            echo "::warning::Proxy returned 404 but body looks unusual — manual check recommended."
          fi
          echo "Proxy verified — /r/* path returns 404 for missing slug as expected."

      # Purge Cloudflare edge cache after every successful deploy.
      # Belt-and-suspenders: static assets use hashed filenames so a
      # new build is referenced by new URLs anyway, but if any HTML
      # response was opportunistically cached, this clears it. The
      # 2026-05-18 /docs/[id] incident took an extra hard-refresh
      # cycle to confirm — automated purge removes that variable
      # from future incident diagnosis.
      #
      # `continue-on-error: true` — the existing CLOUDFLARE_API_TOKEN
      # is scoped to Pages:Edit + Workers:Edit; it may NOT have
      # zone-level Cache:Purge. If the call returns 403/Auth 10000
      # we treat as a benign no-op rather than failing the deploy
      # (the deploy already succeeded by this point). To make the
      # purge load-bearing, widen the token to include the zone's
      # Cache Purge:Edit permission.
      #
      # Requires CLOUDFLARE_ZONE_ID secret on the repo. If missing,
      # the step skips itself rather than erroring.
      - name: Purge Cloudflare edge cache
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID secret not set — skipping cache purge."
            exit 0
          fi
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          if echo "$response" | grep -q '"success":true'; then
            echo "Cache purged successfully."
          else
            echo "::warning::Cache purge did not return success — token may lack Cache Purge:Edit on the zone."
          fi
