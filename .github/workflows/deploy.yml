name: Deploy

# Production deploy with a preview-gated pipeline. Today (2026-05-18) a
# straight push-deploy broke prod for ~15 min because GH Actions didn't
# have NEXT_PUBLIC_* vars set at build time and Next inlined them as
# undefined. Now: every build first goes to a preview URL, smoke-tests
# against that URL, and only if the smoke test passes does the SAME
# artifact get re-deployed to main. A broken bundle stays in preview
# and prod keeps serving the last known-good deploy.
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN — a cfut_ token with Pages:Edit and
#     Workers Scripts:Edit (account scope), Workers Routes:Edit on the
#     htmlradar.com and htmlradar.page zones (the proxy deploy syncs
#     [[routes]] and fails without it), and Cache Purge:Edit on both zones
#     (the purge below is mandatory and fails the deploy).
#   - CLOUDFLARE_ZONE_ID — the htmlradar.com zone.
#   - CLOUDFLARE_ZONE_ID_PAGE — the htmlradar.page zone, which serves every
#     recipient document.
# Required repository variables:
#   - CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id (not a secret).
#   - SHARE_BASE — the recipient-link base URL (not a secret). Optional:
#     defaults to https://htmlradar.page (the code's own default) if empty
#     or unset.
#
# `.env.production` (packages/app/.env.production) is generated by the
# preflight step below from these secrets — it is NEVER committed:
#   - NEXT_PUBLIC_SUPABASE_URL — public, anon-key-only, safe to commit
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY — public-by-design (RLS gates writes)
#   - NEXT_PUBLIC_SHARE_BASE — public, the recipient-link base URL
# The build sanity check (preflight) blocks deploy if these aren't set.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 3.114.17

jobs:
  deploy:
    name: Deploy via preview → prod
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Preflight — verify required secrets are set, then write .env.production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHARE_BASE: ${{ vars.SHARE_BASE }}
        run: |
          set -e
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL is not set on the repository."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY is not set on the repository."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi
          # SHARE_BASE is optional — fall back to the code's own default
          # (packages/app/src/lib/share-url.ts) so a missing repo variable
          # doesn't silently ship a different base than local/dev.
          SHARE_BASE="${SHARE_BASE:-https://htmlradar.page}"
          echo "Using NEXT_PUBLIC_SHARE_BASE=$SHARE_BASE"
          # The trust layer's Gate 2 setting, read from the ONE place it is
          # written: packages/proxy/wrangler.toml, which is also where
          # wrangler reads it for the Worker. The Worker gates the
          # apex-to-handle redirect with it and the app gates allocating and
          # printing handle links with it, so the two halves cannot disagree
          # (Sol's ninth finding). Absent or unreadable means off, which is
          # the shipped state and the safe one.
          TRUST_HANDLES=$(sed -n 's/^TRUST_HANDLES[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' packages/proxy/wrangler.toml | head -1)
          echo "Using NEXT_PUBLIC_TRUST_HANDLES=${TRUST_HANDLES:-(off)}"
          # Write a runner-local .env.production. This file lives only on
          # the ephemeral GitHub Actions runner — never committed to the
          # repo. Next.js auto-loads it during the build so NEXT_PUBLIC_*
          # values get inlined into the client bundle. After the build
          # the runner is destroyed and the file is gone.
          cat > packages/app/.env.production <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
          NEXT_PUBLIC_SHARE_BASE=$SHARE_BASE
          NEXT_PUBLIC_TRUST_HANDLES=$TRUST_HANDLES
          EOF
          echo "Preflight OK — .env.production written for build."

      - name: Build tracker
        run: pnpm --filter @htmlradar/tracker build

      - name: Copy tracker into app's public/v1
        run: cp packages/tracker/dist/tracker.js packages/app/public/v1/tracker.js

      - name: Build app for Cloudflare Pages
        run: cd packages/app && pnpm exec next-on-pages

      - name: Bundle check — verify NEXT_PUBLIC_* were actually inlined
        env:
          SHARE_BASE: ${{ vars.SHARE_BASE }}
        run: |
          set -e
          BUNDLE_DIR="packages/app/.vercel/output/static/_worker.js"
          if ! grep -rq 'supabase.co' "$BUNDLE_DIR" 2>/dev/null; then
            echo "::error::Built bundle has no supabase.co URL — NEXT_PUBLIC_SUPABASE_URL was undefined at build time."
            exit 1
          fi
          SHARE_BASE="${SHARE_BASE:-https://htmlradar.page}"
          if ! grep -rqF "$SHARE_BASE" "$BUNDLE_DIR" 2>/dev/null; then
            echo "::error::Built bundle has no '$SHARE_BASE' — NEXT_PUBLIC_SHARE_BASE was undefined at build time."
            exit 1
          fi
          echo "Bundle check OK — NEXT_PUBLIC_* values inlined."

      # Preview deploy with internal retry. CF Pages occasionally returns
      # "Unknown internal error" on a fresh upload — pure transient noise,
      # the next attempt 30s later succeeds. Before this retry block the
      # whole workflow failed → user got a deploy-failure email for what
      # was effectively a CF blip. We retry up to 3 times before giving
      # up, so genuine bundle/auth issues still surface but transient CF
      # 5xx-class errors stay silent.
      #
      # Switched off wrangler-action@v3 because that action has no
      # built-in retry knob — instead we shell out to the wrangler CLI
      # and wrap it in a retry loop. Same end result (the same wrangler
      # binary runs the same command), just with our own resilience.
      - name: Deploy to PREVIEW (not main) with retry
        id: preview-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          set -o pipefail
          LOG=/tmp/preview-deploy.log
          : > "$LOG"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "Preview deploy attempt $attempt..."
            if npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy packages/app/.vercel/output/static \
                --project-name=htmlradar \
                --branch=ci-preview \
                --commit-hash="$HEAD_SHA" \
                --commit-dirty=false 2>&1 | tee -a "$LOG"; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Preview deploy failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Preview deploy attempt $attempt failed — retrying in 30s..."
            sleep 30
          done
          # Wrangler prints the deployment URL on a line containing
          # ".htmlradar.pages.dev". Grab the last such URL from the log.
          URL=$(grep -oE 'https://[a-z0-9-]+\.htmlradar\.pages\.dev' "$LOG" | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract preview deployment URL from wrangler output."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to: $URL"

      # Brief cold-start grace — CF Pages preview deploys race ahead of
      # full edge propagation; the very first request to a fresh URL
      # occasionally returns a stale/empty body for one path before
      # settling. 8 seconds is enough in practice and trivial in cost.
      - name: Preview warm-up wait
        run: sleep 8

      - name: Smoke test the preview deploy
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.preview_url }}
        run: |
          set -e
          fail=0
          # Per-check retry: up to 3 attempts, 2s back-off. Eliminates
          # transient cold-start flakes (the kind that nuked the
          # ac1144e deploy with a false-negative on /robots.txt) without
          # masking real regressions — a genuinely broken bundle fails
          # all 3 attempts.
          check() {
            local path="$1"
            local expect="$2"
            local attempt
            local code
            for attempt in 1 2 3; do
              code=$(curl -sL -o /tmp/page -w "%{http_code}" "${PREVIEW_URL}${path}")
              if [ "$code" = "200" ] && { [ -z "$expect" ] || grep -q "$expect" /tmp/page; }; then
                echo "  ✓ ${path}"
                return
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 2
              fi
            done
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned HTTP ${code} (expected 200) after 3 attempts"
            else
              echo "::error::${path} returned 200 but body missing expected '${expect}' after 3 attempts"
            fi
            fail=$((fail + 1))
          }

          echo "Smoke testing preview: $PREVIEW_URL"
          check "/" "HTMLRadar"
          check "/pricing" "pricing"
          check "/sign-in" "sign-in"
          check "/docs" ""    # 200 with redirect or content is fine
          check "/feedback" "Tell us what we missed"
          check "/v1/tracker.js" "qualifiedMs"   # confirms Release B tracker shipped
          check "/sitemap.xml" "htmlradar.com"   # confirms SEO fix shipped
          check "/robots.txt" "Sitemap"

          if [ $fail -gt 0 ]; then
            echo "::error::$fail smoke check(s) failed — NOT promoting to prod."
            exit 1
          fi
          echo "All smoke checks passed."

      # Same retry pattern as the preview step. This is the worse of the
      # two failure modes — preview already passed smoke, so a transient
      # CF 5xx on the prod promotion was emailing a false failure for a
      # deploy that was effectively done. 3 attempts with 30s back-off.
      - name: Promote preview → prod (deploy to main branch) with retry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          set -o pipefail
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "Prod promotion attempt $attempt..."
            if npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy packages/app/.vercel/output/static \
                --project-name=htmlradar \
                --branch=main \
                --commit-hash="$HEAD_SHA" \
                --commit-dirty=false; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Prod promotion failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Prod promotion attempt $attempt failed — retrying in 30s..."
            sleep 30
          done

      # Cloudflare Pages deploys the Next.js app. The /r/* recipient
      # path is served by a separate Worker (packages/proxy) — without
      # this step, proxy changes (download guard, materials panel,
      # tracker injection) sit unpublished even after CI is green.
      # The 2026-05-18 incident where Feature 1's download guard was
      # 'shipped' to git but not live until manually `wrangler deploy`d
      # is the bug this step prevents.
      #
      # GIT_SHA is bound into the Worker as a plain var so the verify
      # steps below can prove that THIS commit is what got deployed.
      # No continue-on-error: `wrangler deploy` also syncs [[routes]], and
      # there are two of them now — htmlradar.page for recipient documents
      # and htmlradar.com/r/* for the redirect that keeps old links open — so
      # the token needs Workers Routes:Edit on both zones.
      - name: Deploy proxy worker (packages/proxy)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: packages/proxy
          command: deploy
          vars: GIT_SHA

      # Monitor cron worker (packages/monitor) — same pattern as the
      # proxy step. Without this step the cron monitor sits at whatever
      # version was last manually deployed.
      - name: Deploy monitor worker (packages/monitor)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: packages/monitor
          command: deploy
          vars: GIT_SHA

      # The proxy stamps every response with X-HTMLRadar-Version = GIT_SHA
      # (see withNoIndex in packages/proxy/src/index.ts). Reading it from
      # the live route proves the new version is what the edge serves.
      #
      # Read on htmlradar.page: that is the host recipient documents are
      # served from. htmlradar.com/r/ only redirects there now, which the
      # next step checks.
      - name: Verify proxy worker serves this commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            live=$(curl -sS -o /dev/null -w '%header{x-htmlradar-version}' "https://htmlradar.page/r/nonexistent-smoke-test")
            if [ "$live" = "$HEAD_SHA" ]; then
              echo "Proxy verified — X-HTMLRadar-Version matches $HEAD_SHA."
              exit 0
            fi
            echo "Proxy reports '$live' (attempt $attempt), expected $HEAD_SHA — retrying in 5s..."
            sleep 5
          done
          echo "::error::Proxy is not serving commit $HEAD_SHA."
          exit 1

      # The monitor has no HTTP route (cron only), so read the GIT_SHA
      # binding of the active version back from the Workers API instead.
      - name: Verify monitor worker carries this commit
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -e
          live=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/htmlradar-monitor/settings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            | jq -r '.result.bindings[] | select(.name == "GIT_SHA") | .text')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::Monitor worker GIT_SHA is '$live', expected $HEAD_SHA."
            exit 1
          fi
          echo "Monitor verified — deployed GIT_SHA matches $HEAD_SHA."

      # Purge Cloudflare edge cache after every successful deploy, on both
      # zones, and fail the deploy if either purge does not succeed.
      #
      # Belt-and-suspenders for the application: static assets use hashed
      # filenames so a new build is referenced by new URLs anyway. Not
      # belt-and-suspenders for htmlradar.com/r/, which is why this is no
      # longer allowed to fail quietly. That path can be a 301 to
      # htmlradar.page or the document served in place, depending on
      # LEGACY_HOSTS, and a stale cached copy of the wrong one is a
      # customer's link answering yesterday's deploy. The step used to carry
      # continue-on-error because the token might lack Cache Purge:Edit; the
      # answer to that is a wider token, not a silent no-op, and Sol's review
      # of the switch plan called for exactly this.
      - name: Purge Cloudflare edge cache (both zones)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID_PAGE: ${{ secrets.CLOUDFLARE_ZONE_ID_PAGE }}
        run: |
          set -e
          purge_zone() {
            zone_name="$1"
            zone_id="$2"
            if [ -z "$zone_id" ]; then
              echo "::error::Zone id secret for ${zone_name} is not set — cache cannot be purged."
              exit 1
            fi
            response=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            # Only success + error codes; the full response carries zone ids.
            echo "${zone_name}: $(echo "$response" | jq -c '{success, errors: [.errors[]?.code]}')"
            if [ "$(echo "$response" | jq -r .success)" != "true" ]; then
              echo "::error::Cache purge failed for ${zone_name} — the token needs Cache Purge:Edit on that zone."
              exit 1
            fi
            echo "${zone_name} cache purged."
          }
          purge_zone htmlradar.com "$CF_ZONE_ID"
          purge_zone htmlradar.page "$CF_ZONE_ID_PAGE"

      # What a recipient holding an old link actually gets, read after the
      # purge so no cached answer can flatter it, and on a real share rather
      # than a made-up slug that would miss the cache anyway.
      #
      # The expected answer is whatever the proxy was just configured for, so
      # this step stays true on both sides of the switch: LEGACY_HOSTS empty
      # means htmlradar.com still serves the document in place (200, gate page
      # included), and a non-empty LEGACY_HOSTS means the permanent redirect
      # is on (301 to the same path on the content domain). Reading the mode
      # out of the deployed wrangler.toml is what makes the check follow the
      # deploy instead of having to be edited alongside it.
      - name: Verify the legacy host answers in the mode it was deployed in
        run: |
          set -e
          legacy=$(sed -n 's/^LEGACY_HOSTS[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' packages/proxy/wrangler.toml)
          if [ -n "$legacy" ]; then
            expected=301
            mode="redirect ON (LEGACY_HOSTS = '${legacy}')"
          else
            expected=200
            mode="redirect OFF (LEGACY_HOSTS empty — both hosts serve)"
          fi
          headers=$(curl -sI "https://htmlradar.com/r/qa-smoke-deck")
          status=$(printf '%s' "$headers" | awk 'NR==1 {print $2}')
          location=$(printf '%s' "$headers" | awk 'tolower($1) == "location:" {print $2}' | tr -d '\r')
          echo "Configured: ${mode} — expected HTTP ${expected}"
          echo "Live:       HTTP ${status} ${location}"
          if [ "$status" != "$expected" ]; then
            echo "::error::htmlradar.com/r/qa-smoke-deck answered HTTP ${status}, but the deployed proxy is configured for ${expected} (${mode})."
            exit 1
          fi
          if [ "$expected" = "301" ] && [ "$location" != "https://htmlradar.page/r/qa-smoke-deck" ]; then
            echo "::error::Redirect points at '${location}', expected https://htmlradar.page/r/qa-smoke-deck."
            exit 1
          fi
          echo "Legacy host verified."
