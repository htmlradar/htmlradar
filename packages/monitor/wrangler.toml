name = "htmlradar-monitor"
main = "src/index.ts"
compatibility_date = "2026-05-18"
compatibility_flags = []
workers_dev = false  # cron-only worker, no HTTP entrypoint exposed

# Every 5 minutes. Cheapest possible cadence that still catches a
# 15-min-or-less regression before the founder checks email.
[triggers]
# Second cron: 04:00 UTC / 09:30 IST — daily thread scan, Telegram only.
# Third cron: 03:30 UTC — daily maintenance sentinel, half an hour before the
# scan so the scan_run row it reads is yesterday's finished one.
crons = ["*/5 * * * *", "0 4 * * *", "30 3 * * *"]

# Non-sensitive config travels in [vars] so they're visible in the
# wrangler.toml diff. Everything else is a Worker secret, set once with
# `wrangler secret put <NAME>` (see README.md) and never enters the repo:
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY
#   POSTHOG_PROJECT_KEY   PostHog project key for the app_events replay;
#                         unset = replay is a no-op
#   QA_BOT_USER_ID        profile id of the QA smoke-test account; its rows
#                         are skipped during replay so synthetic traffic
#                         never reaches the dashboards
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   optional, daily thread scan
[vars]
SUPABASE_URL = "https://ewennjnxuqjzsgawbzur.supabase.co"
RESEND_FROM = "HTMLRadar <hello@htmlradar.com>"
ALERT_TO = "hello@htmlradar.com"
# PostHog ingest host for the app_events replay (see replayAppEvents in
# src/index.ts).
POSTHOG_HOST = "https://us.i.posthog.com"

[observability]
enabled = true
