name = "htmlradar-proxy"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = []
workers_dev = false  # We don't want this exposed at *.workers.dev — only via the zone route

# Production routes.
#
# htmlradar.page is the content domain: recipient documents are served there
# and nothing else lives on it, so the worker takes the whole zone and 404s
# everything that is not a share.
#
# htmlradar.com/r/* stays routed because every link sent before the move
# points at it. The worker answers those with a 301 to htmlradar.page (see
# legacy-host block in src/index.ts). Anything else on the apex still falls
# through to Cloudflare Pages (the Next.js app).
#
# DEPLOY PERMISSION: `wrangler deploy` syncs this block, so the API token
# needs Workers Routes: Edit on BOTH zones. Adding the second zone is
# PENDING-ON-ABHI P-30.
#
# THE ROUTE STAYS THE APEX IN THIS COMMIT. WIDENING IT IS A SEPARATE DEPLOY,
# AND THE ORCHESTRATOR DOES IT.
#
# Custom domains need this pattern to become `*/*`: Cloudflare for SaaS sends a
# customer's own hostname (decks.acme.com) here through the fallback origin
# customers.htmlradar.page, and the worker only sees it if the route covers
# every hostname on the zone rather than the apex alone.
#
# ORDER, and it is not negotiable (Astra's review, 17 September; sprint file
# "Sequencing"). The stored-host checks, the refusal of unknown hostnames and
# the probe path go out FIRST, on this route, and are verified on production.
# Only then does the orchestrator change this one line to
#
#   pattern = "*/*"
#
# and deploy again, on its own, verifying a second time: customers.htmlradar.page
# 404, and a claimed test hostname answering the probe path and nothing else.
# One deploy carrying both does not prove that the route change and the code
# reached the edge together, and for the minutes in between a widened route
# with the old code would serve every apex share on every hostname pointed at
# us.
#
# The checks are correct under BOTH routes. Under this one no custom hostname
# reaches the worker at all, so every rule about customer domains is inert
# rather than wrong; under `*/*` the same rules answer. The test suite covers
# the rules themselves, which do not read the route.
[[routes]]
pattern = "htmlradar.page/*"
zone_name = "htmlradar.page"

[[routes]]
pattern = "htmlradar.com/r/*"
zone_name = "htmlradar.com"

[vars]
# Upstream for the tracker bundle. Documents load it from their own host,
# /v1/tracker.js, which this worker answers by fetching this URL.
TRACKER_URL = "https://htmlradar.com/v1/tracker.js"
# Host that serves recipient documents; everything else on it is a 404.
SHARE_HOST = "htmlradar.page"
# Comma-separated hosts that only redirect to SHARE_HOST. Empty means no host
# redirects: every host this worker is routed on serves documents where the
# request arrived. Self-hosters who never moved leave it empty.
#
# It ships empty on purpose. The first deploy of the content domain then
# changes nothing a recipient sees — htmlradar.com/r/ keeps serving the
# document it always served, htmlradar.page starts serving it too, and the
# same link works on either host.
#
# GATE 2 (docs/workstreams/content-domain/SWITCH-PLAN-2026-08-31.md) turns the
# permanent redirect on: set this to "htmlradar.com" and deploy. From then on
# every htmlradar.com/r/ link answers 301 to the same path and query on
# SHARE_HOST. Setting it back to "" and deploying is the whole rollback; no
# data is touched either way.
#
# NOTE, 17 September 2026, with custom domains. This line decides only whether
# the old host REDIRECTS. Whether the old host is SERVED is not configurable:
# resolveHost recognises htmlradar.com as the apex whatever this says (see
# ORIGIN_HOST in src/index.ts), so emptying this value still serves every link
# sent before the move, in place, exactly as it did before. What changed is
# that a hostname named NOWHERE — neither the share host, nor a subdomain of
# it, nor this list, nor a claimed customer domain — is now refused instead of
# being treated as the apex.
LEGACY_HOSTS = "htmlradar.com"

# The trust layer's one gate setting, and the whole of its rollback.
# Design: docs/workstreams/content-domain/TRUST-LAYER-DESIGN-2026-08-31.md.
#
# Three states:
#   ""   OFF — how it ships. /r/{slug} serves the document exactly as it did
#        before any of this existed, and /r/{slug}/frame and /r/{slug}/print
#        answer the standard not-found. Nothing a recipient sees changes.
#   "a,b" a comma-separated slug list. Gate 1: the QA shares only.
#   "*"  every share. Gate 3, and only after the real-device comparison in the
#        design's "What wrapping does to the tracker" has passed.
#
# Rolling back is this value and one deploy. No database change either way, and
# no already-sent link changes its address in any state.
TRUST_WRAPPER = ""

# The trust layer's OTHER gate: handle links (Gate 2 in the design's
# "Migration order, gates, and rollback"), and the whole of its rollback.
#
# THIS ONE LINE IS THE SETTING FOR BOTH HALVES. wrangler hands it to the
# Worker, where it gates the apex-to-handle redirect; the deploy workflow's
# preflight reads this same line into NEXT_PUBLIC_TRUST_HANDLES for the
# application build, where it gates allocating a handle on a customer's first
# share and stamping it on new links. Sol's ninth finding: the redirects and
# the newly generated links must switch off together, so they read one value.
#
# Two states:
#   ""  OFF — how it ships. No handle is ever allocated, no share stores a
#       hostname, every link is the apex link it has always been.
#   "*" ON — Gate 2. A customer's first share after this allocates their
#       handle, new links are stamped with it and printed as
#       {handle}.htmlradar.page/r/{slug}, and apex requests for those shares
#       redirect there.
#
# Rolling back is this value and one deploy. Handles and stored hostnames are
# immutable and stay behind, which is harmless: the shares carrying them keep
# resolving on their own host, because the stored-hostname rules that serve
# them are not gated. Nothing already sent moves in either direction.
#
# Needs the wildcard record and route below installed first.
TRUST_HANDLES = ""

# WILDCARD DNS RECORD, NOT YET INSTALLED. Handle hosts still need one wildcard
# DNS record (*.htmlradar.page, proxied); the `*/*` route above now covers them
# as well, so no further route is needed. Until the record exists no handle
# host resolves, so every handle rule in resolveHost/enforceStoredHost stays
# inert in production.
#
# Customer domains do not use that record: they arrive through Cloudflare for
# SaaS and the fallback origin customers.htmlradar.page, which is reserved
# infrastructure and answers 404 to everything (see FALLBACK_ORIGIN_LABEL in
# src/index.ts).

# Secrets — set via `wrangler secret put`:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ANON_KEY        (passed to tracker as data-supabase-anon-key)
#   SESSION_SECRET           (HMAC key for password-auth cookies)

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "htmlradar-docs"

[observability]
enabled = true
