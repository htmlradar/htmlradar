title = "HTMLRadar gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9_]{20,}'''
keywords = ["re_"]

[[rules]]
id = "supabase-jwt"
description = "Supabase JWT (anon or service-role)"
regex = '''eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["eyJ"]

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token"
regex = '''(?i)cloudflare[_-]?api[_-]?token["'\s]*[:=]["'\s]*[A-Za-z0-9_-]{40,}'''
keywords = ["cloudflare"]

# No path-level allow-list on purpose: docs/ and .env.example are scanned like
# every other file, so a real value pasted there fails CI. .env.example holds
# only blank values and non-secret defaults (a bucket name, a sender address,
# a host URL), none of which is secret-shaped, so it needs no line-level
# exception either.
[allowlist]
description = "Exact non-secret values that look like secrets"
regexes = [
  # Fake webhook-signature fixture in payments.test.ts — NOT a real secret,
  # used only to exercise the standardwebhooks HMAC round-trip in tests.
  '''whsec_abc123xyz789defghijklmnop''',
  # IndexNow key: public by protocol design (must be served at htmlradar.com/<key>.txt
  # for search engines to verify ownership). The file under packages/app/public is
  # that proof.
  '''aa73fbe8e79ef39105fe22e99a64e50c''',
]
