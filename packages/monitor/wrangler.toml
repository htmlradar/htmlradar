name = "htmlradar-monitor"
main = "src/index.ts"
compatibility_date = "2026-05-18"
compatibility_flags = []
# The worker is no longer cron-only: it answers exactly one HTTP path,
# POST /telegram/webhook, which is how a "Post as me" tap reaches it (see
# handleWebhookRequest in src/index.ts). A workers.dev address is the cheapest
# way to give Telegram somewhere to deliver to — no zone, no route, no DNS. The
# endpoint's protection is the TELEGRAM_WEBHOOK_SECRET header check, not the
# obscurity of the address: without that secret set, every request is a 404.
workers_dev = true

# Every 5 minutes. Cheapest possible cadence that still catches a
# 15-min-or-less regression before the founder checks email.
[triggers]
# Second cron: 04:00 UTC / 09:30 IST — the listening radar's mining scan. Reads
#   the Google Alerts feeds, Hacker News and Reddit, classifies and scores every
#   item, and stores it in radar_items. Sends no message.
# Third cron: 03:30 UTC — daily maintenance sentinel, half an hour before the
#   scan so the scan_run row it reads is yesterday's finished one.
# Fourth cron: 05:00 UTC — the daily digest, an hour after the mining scan, so
#   it reads a finished harvest. Drafts founder-voice replies for the worthwhile
#   items and Telegrams one batch; Monday carries the weekly insight too.
crons = ["*/5 * * * *", "0 4 * * *", "30 3 * * *", "0 5 * * *"]

# Non-sensitive config travels in [vars] so they're visible in the
# wrangler.toml diff. Everything else is a Worker secret, set once with
# `wrangler secret put <NAME>` (see README.md) and never enters the repo:
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY
#   POSTHOG_PROJECT_KEY   PostHog project key for the app_events replay;
#                         unset = replay is a no-op
#   QA_BOT_USER_ID        profile id of the QA smoke-test account; its rows
#                         are skipped during replay so synthetic traffic
#                         never reaches the dashboards
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   optional, daily digest destination
#   ALERT_FEEDS           the listening radar's Google Alerts RSS feed URLs,
#                         newline- or comma-separated ('phrase|url' or bare url);
#                         secret because a feed URL is readable by anyone holding
#                         it; unset = radar reads Hacker News and Reddit only
#   RADAR_DRAFTS          reply-draft feature flag; '1'/'true'/'on' turns on the
#                         drafted replies in the digest; unset = log-and-mine only
#   TELEGRAM_WEBHOOK_SECRET   the shared secret Telegram sends back in
#                         X-Telegram-Bot-Api-Secret-Token on every webhook
#                         delivery; unset = the webhook path 404s and one-tap
#                         posting is off
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET   the "script" app at
#                         reddit.com/prefs/apps
#   REDDIT_REFRESH_TOKEN  the permanent token ops/scripts/reddit_auth.py
#                         obtains once; exchanged for a short-lived access
#                         token on each post and never written down
#   REDDIT_USERNAME       the founder's Reddit handle, for the descriptive
#                         User-Agent Reddit's API rules ask for; secret only
#                         because it is personal and this repository is public
[vars]
SUPABASE_URL = "https://ewennjnxuqjzsgawbzur.supabase.co"
RESEND_FROM = "HTMLRadar <hello@htmlradar.com>"
ALERT_TO = "hello@htmlradar.com"
# PostHog ingest host for the app_events replay (see replayAppEvents in
# src/index.ts).
POSTHOG_HOST = "https://us.i.posthog.com"

[observability]
enabled = true
